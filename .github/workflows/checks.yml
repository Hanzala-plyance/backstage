name: Backstage checks
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: song-converter/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Test promotion rules
        run: python -m unittest discover -s scripts -p 'test_promotion.py'
      - name: Install converter dependencies
        if: hashFiles('song-converter/requirements.txt') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install -r song-converter/requirements.txt
      - name: Test converter and shared library
        if: hashFiles('song-converter/requirements.txt') != ''
        run: python -m unittest discover -s song-converter/tests -p 'test_*.py'
        env:
          PYTHONPATH: song-converter
          BACKSTAGE_SONGS_DIR: ${{ runner.temp }}/backstage-test-songs
      - name: Test controller routing
        if: hashFiles('mac-riff/build/session-plan.js') != ''
        run: node --test mac-riff/build/tests/*.test.js
      - name: Install desktop dependencies
        if: hashFiles('desktop/package-lock.json') != ''
        working-directory: desktop
        run: npm ci
      - name: Test and build desktop
        if: hashFiles('desktop/package-lock.json') != ''
        working-directory: desktop
        run: |
          npm test
          npm run build
      - name: Smoke test desktop
        if: hashFiles('desktop/package-lock.json') != ''
        working-directory: desktop
        run: xvfb-run -a npm run test:app
      - name: Check promotion route and release evidence
        if: github.event_name == 'pull_request'
        run: python scripts/check_promotion.py
        env:
          BACKSTAGE_BASE_BRANCH: ${{ github.base_ref }}
          BACKSTAGE_HEAD_BRANCH: ${{ github.head_ref }}
          BACKSTAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Upload smoke failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-failure
          path: desktop/test-results/
          if-no-files-found: ignore
